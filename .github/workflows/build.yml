name: Build

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++

    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libusb-1.0-0-dev cmake build-essential clang

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure with CMake
        run: cmake -S . -B build -DBUILD_TESTING=ON -DENABLE_VKFFT=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Native tests before packaging
        run: ctest --test-dir build --output-on-failure --timeout 60

      - name: Go race tests and vet
        working-directory: stream_client/go
        run: |
          go test -race -timeout 60s ./...
          go vet ./...

      - name: Node tests
        run: node stream_client/node/client.test.js

      - name: Install
        run: sudo cmake --install build

      - name: Verify library
        run: ls -la /usr/local/lib/librtlsdr* /usr/local/bin/rtl_*

      - name: Package artifacts
        run: |
          ARTIFACT_DIR="rtl-sdr-${{ github.ref_name }}-${{ matrix.compiler }}-linux"
          mkdir -p "$ARTIFACT_DIR/lib" "$ARTIFACT_DIR/include" "$ARTIFACT_DIR/bin"
          cp /usr/local/lib/librtlsdr*.so* "$ARTIFACT_DIR/lib/"
          cp /usr/local/lib/librtlsdr.a "$ARTIFACT_DIR/lib/"
          cp /usr/local/include/rtl-sdr*.h "$ARTIFACT_DIR/include/"
          cp /usr/local/bin/rtl_* "$ARTIFACT_DIR/bin/"
          tar czf "$ARTIFACT_DIR.tar.gz" "$ARTIFACT_DIR"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "rtl-sdr-${{ github.ref_name }}-${{ matrix.compiler }}-linux.tar.gz" --clobber

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.release
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
